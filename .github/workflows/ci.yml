name: offline-quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      ANONYMIZED_TELEMETRY: 'False'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[test]'
      - run: ruff check app scripts evaluation tests
      - run: pytest -q -m 'not evaluation'
      - run: python -m scripts.run_evaluation
      - run: python -m scripts.run_evaluation --validate evaluation/eval_results.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-evaluation
          path: evaluation/
