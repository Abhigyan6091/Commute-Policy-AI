[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "commute-policy-ai"
version = "1.0.0"
description = "Tenant-isolated, versioned transportation policy RAG evaluation system"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3", "PyJWT>=2.9,<3", "httpx>=0.27,<1",
  "chromadb>=0.6,<2", "rank-bm25>=0.2.2,<0.3", "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2", "python-multipart>=0.0.20,<1", "filelock>=3.16,<4"
]
[project.optional-dependencies]
ml = ["sentence-transformers>=3.3,<6"]
test = ["pytest>=8.3,<10", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*", "evaluation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["evaluation: full fixed offline evaluation"]

[tool.ruff]
target-version = "py311"
line-length = 120
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
